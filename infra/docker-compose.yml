services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-${APP_ENV}
    command: ${KC_COMMAND}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST}:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KC_PORT}:8080"
    volumes:
      - ../keycloak/themes:/opt/keycloak/themes:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vca-net

  backend:
    build:
      context: ../apps/backend
    container_name: backend-${APP_ENV}
    profiles:
      - staging
      - prod
    environment:
      APP_DB_HOST: ${APP_DB_HOST}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USERNAME: ${APP_DB_USERNAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PORT: ${KC_PORT}
      KC_REALM: ${KC_REALM}
      KC_ADMIN_HOSTNAME: ${KC_ADMIN_HOSTNAME}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend-uploads:/data/uploads
    ports:
      - "${BACKEND_PORT}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vca-net

  frontend:
    build:
      context: ../apps/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    container_name: frontend-${APP_ENV}
    profiles:
      - staging
      - prod
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped
    networks:
      - vca-net

networks:
  vca-net:
    external: true
    name: vca-net

volumes:
  backend-uploads: